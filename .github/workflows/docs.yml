# The docs site (web/docs) on Cloudflare Workers. Every pull request that touches it builds it; pull requests from
# this repository also upload a preview version; main deploys it. Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets (see /deploy/cloudflare/ on the site); without them it only builds.
name: Docs

on:
  pull_request:
    paths:
      - web/docs/**
      - web/fabric-ui/src/styles/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - web/docs/**
      - web/fabric-ui/src/styles/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/docs
    env:
      # Secrets can't be used in an if: directly
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      SITE_URL: ${{ vars.DOCS_SITE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/docs/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Astro, then Pagefind's search index
      - run: npm run build

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CAN_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/docs
          command: deploy

      # A version that isn't deployed, with its own preview URL. Not for forks, which don't get the secrets.
      - name: Upload a preview
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.CAN_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/docs
          command: versions upload --message "PR #${{ github.event.pull_request.number }}"

      - name: Link the preview
        if: steps.preview.outcome == 'success'
        env:
          OUTPUT: ${{ steps.preview.outputs.command-output }}
        run: |
          url=$(printf '%s\n' "$OUTPUT" | grep -oE 'https://[^ ]+\.workers\.dev' | tail -n 1)
          echo "Preview: ${url:-see the Upload a preview step log}" >> "$GITHUB_STEP_SUMMARY"
