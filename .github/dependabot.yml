# Weekly update pull requests for every dependency manifest. CI (ci.yml) builds, tests and scans each one.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # Released together; one PR keeps them on the same version
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*", "Npgsql.OpenTelemetry"]
      testcontainers:
        patterns: ["Testcontainers*"]
    ignore:
      # The runtime-aligned packages follow the TargetFramework (Directory.Build.props); a major bump means moving it
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories: [/web/admin, /web/docs, /web/fabric-ui]
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /ml
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: [/src/FeedFabric.Api, /src/FeedFabric.Worker.Events, /src/FeedFabric.Application]
    schedule:
      interval: weekly
    ignore:
      # The images follow the TargetFramework too: a newer major can't run a net10.0 app or its EF tool
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
