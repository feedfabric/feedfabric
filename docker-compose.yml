# Credentials come from .env (copy .env.example to get started)
services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Containers use kafka:29092, the host uses localhost:9092.
  # No volume: the outbox in Postgres is the source of truth, so a fresh broker loses nothing that matters in dev.
  kafka:
    image: apache/kafka:4.0.0
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Home timelines. appendonly keeps them across restarts; they can always be rebuilt from Postgres. Valkey is the
  # BSD-licensed fork of Redis and speaks the same protocol, so Redis itself works here too.
  redis:
    image: valkey/valkey:8
    restart: always
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/FeedFabric.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      BlobStorage__Local__Root: /blobs
      MalwareScanning__Enabled: ${MALWARE_SCANNING_ENABLED:-true}
    volumes:
      - blobs:/blobs
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./src

  # Publishes the outbox to Kafka and fans new posts out to followers' timelines in Redis
  worker-events:
    build:
      context: .
      dockerfile: src/FeedFabric.Worker.Events/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: kafka:29092
      BlobStorage__Local__Root: /blobs
      MalwareScanning__Enabled: ${MALWARE_SCANNING_ENABLED:-true}
      MalwareScanning__ClamAv__Host: clamav
    volumes:
      - blobs:/blobs
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./src

  # Only starts with `make simulate`: seeds users and follows and backfills history, then stops (or posts on a timer with Simulator__Live=true)
  simulator:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: src/FeedFabric.Simulator/Dockerfile
    # It stops by itself after the backfill unless Simulator__Live is true
    restart: on-failure
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Malware scanner. Every upload is scanned before it can be published; while this is down, uploads wait in
  # quarantine. The first start downloads the virus database (a few minutes); the volume keeps it after that.
  # Not needed with MALWARE_SCANNING_ENABLED=false in .env.
  clamav:
    image: clamav/clamav-debian:1.4
    restart: always
    ports:
      - "3310:3310"
    volumes:
      - clamavdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # S3 stand-in for local testing. Only starts with `docker compose --profile s3 up -d localstack`;
  # point the API at it with BlobStorage__Provider=S3 (settings in src/FeedFabric.Api/appsettings.Development.json)
  localstack:
    profiles: ["s3"]
    image: localstack/localstack:4.7
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"s3\": \"(available|running)\"'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clamavdb:
  # LocalBlobStorage files, shared by the API (which accepts uploads) and the worker (which scans and processes them)
  blobs:
  pgdata:
  redisdata:
