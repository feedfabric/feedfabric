<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="FeedFabric">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2bb3a3"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- The fabric: feed rows (white) woven over and under the ranking threads (lilac). Each strand is outlined in
       the background gradient so the crossings read as over and under. -->
  <g stroke="url(#bg)" stroke-width="3">
    <rect x="30" y="20" width="16" height="88" rx="8" fill="#d9d3ff"/>
    <rect x="56" y="20" width="16" height="88" rx="8" fill="#d9d3ff"/>
    <rect x="82" y="20" width="16" height="88" rx="8" fill="#d9d3ff"/>
    <rect x="20" y="30" width="88" height="16" rx="8" fill="#fff"/>
    <rect x="20" y="56" width="88" height="16" rx="8" fill="#fff"/>
    <rect x="20" y="82" width="88" height="16" rx="8" fill="#fff"/>
  </g>
  <!-- Where a thread passes over a row -->
  <g fill="#d9d3ff" stroke="url(#bg)" stroke-width="3">
    <rect x="30" y="52" width="16" height="24"/>
    <rect x="56" y="26" width="16" height="24"/>
    <rect x="56" y="78" width="16" height="24"/>
    <rect x="82" y="52" width="16" height="24"/>
  </g>
</svg>
