[project]
name = "feedfabric"
version = "0.1.0"
description = "FeedFabric for your servers: posts, feeds, comments, signals and typed post data, with an API key"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Source = "https://github.com/feedfabric/feedfabric/tree/main/sdks/python"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedfabric"]

[tool.mypy]
strict = true
files = ["src", "tests"]
